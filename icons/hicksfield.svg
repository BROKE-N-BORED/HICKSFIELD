<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <clipPath id="clapper-clip">
      <rect x="92" y="88" width="328" height="76" rx="14"/>
    </clipPath>
  </defs>
  <!-- Midnight cinema: dark room, brass light, theater red board -->
  <rect x="4" y="4" width="504" height="504" rx="96" fill="#171210" stroke="#3d3129" stroke-width="6"/>
  <!-- Clapper, tilted, brass and cream stripes -->
  <g transform="rotate(-8 256 126)">
    <g clip-path="url(#clapper-clip)">
      <rect x="92" y="88" width="328" height="76" fill="#d9a441"/>
      <polygon points="92,164 150,88 192,88 134,164" fill="#f2e9d8"/>
      <polygon points="190,164 248,88 290,88 232,164" fill="#f2e9d8"/>
      <polygon points="288,164 346,88 388,88 330,164" fill="#f2e9d8"/>
      <polygon points="386,164 420,128 420,88 402,88 386,106" fill="#f2e9d8"/>
    </g>
    <rect x="92" y="88" width="328" height="76" rx="14" fill="none" stroke="#a87c2a" stroke-width="4"/>
  </g>
  <!-- Board -->
  <rect x="92" y="180" width="328" height="232" rx="16" fill="#8e2f32" stroke="#6e2326" stroke-width="4"/>
  <!-- Hinge dots -->
  <circle cx="118" cy="196" r="8" fill="#6e2326"/>
  <circle cx="394" cy="196" r="8" fill="#6e2326"/>
  <!-- Projector lens -->
  <circle cx="256" cy="288" r="66" fill="#d9a441"/>
  <circle cx="256" cy="288" r="52" fill="#171210"/>
  <circle cx="256" cy="288" r="52" fill="none" stroke="#a87c2a" stroke-width="3"/>
  <circle cx="256" cy="288" r="26" fill="#2b211b"/>
  <circle cx="240" cy="272" r="11" fill="#f2e9d8" opacity="0.9"/>
  <!-- Film sprockets along the bottom of the board -->
  <g fill="#f2e9d8">
    <rect x="112" y="372" width="26" height="18" rx="3"/>
    <rect x="152" y="372" width="26" height="18" rx="3"/>
    <rect x="192" y="372" width="26" height="18" rx="3"/>
    <rect x="232" y="372" width="26" height="18" rx="3"/>
    <rect x="272" y="372" width="26" height="18" rx="3"/>
    <rect x="312" y="372" width="26" height="18" rx="3"/>
    <rect x="352" y="372" width="26" height="18" rx="3"/>
  </g>
</svg>
